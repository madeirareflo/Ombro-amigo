<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Storage browser harness</title>
</head>
<body>
<script type="module">
import {
  initializeConversationStorage,
  saveConversationState,
  loadConversationState,
  clearAllSensitiveState,
  getConversationStorageStatus
} from '../../storage/secure-store.js';

const DB_NAME='ombro-amigo.secure.v1';
const STATE_STORE='state';
const KEY_STORE='keys';
const STATE_ID='conversation';
const BACKUP_ID='conversation-backup';
const KEY_ID='conversation-key';

function requestResult(request){
  return new Promise((resolve,reject)=>{
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error || new Error('IndexedDB request failed'));
  });
}

function transactionDone(tx){
  return new Promise((resolve,reject)=>{
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error || new Error('IndexedDB transaction failed'));
    tx.onabort=()=>reject(tx.error || new Error('IndexedDB transaction aborted'));
  });
}

async function openDb(){
  return requestResult(indexedDB.open(DB_NAME,1));
}

async function inspectDb(){
  const db=await openDb();
  const tx=db.transaction([STATE_STORE,KEY_STORE],'readonly');
  const state=tx.objectStore(STATE_STORE);
  const keys=tx.objectStore(KEY_STORE);
  const [primary,backup,key]=await Promise.all([
    requestResult(state.get(STATE_ID)),
    requestResult(state.get(BACKUP_ID)),
    requestResult(keys.get(KEY_ID))
  ]);
  await transactionDone(tx);
  db.close();
  return {
    primary,
    backup,
    key:{
      exists:Boolean(key),
      constructor:key?.constructor?.name || null,
      extractable:key?.extractable ?? null,
      algorithm:key?.algorithm?.name || null,
      usages:key?.usages ? Array.from(key.usages) : []
    }
  };
}

async function corruptPrimary(){
  const db=await openDb();
  const tx=db.transaction(STATE_STORE,'readwrite');
  const state=tx.objectStore(STATE_STORE);
  const primary=await requestResult(state.get(STATE_ID));
  if(!primary?.encrypted?.ciphertext?.length) throw new Error('Primary record unavailable');
  primary.encrypted.ciphertext[0]^=1;
  state.put(primary,STATE_ID);
  await transactionDone(tx);
  db.close();
}

window.storageHarness={
  initializeConversationStorage,
  saveConversationState,
  loadConversationState,
  clearAllSensitiveState,
  getConversationStorageStatus,
  inspectDb,
  corruptPrimary,
  seedLegacy(value){
    localStorage.setItem('ombro-amigo.local-state.v2',JSON.stringify(value));
  },
  legacyRaw(){
    return localStorage.getItem('ombro-amigo.local-state.v2');
  }
};
window.__storageHarnessReady=true;
</script>
</body>
</html>
